[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[project]
name = "notes-app"
version = "0.1.0"
description = "Demo Notes API with user accounts for RepoAgent testing"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
