services:
  repo-planner:
    build:
      context: .
      dockerfile: Dockerfile.agents
    image: repoagent-planner:latest
    container_name: repoagent-planner
    command:
      - python
      - -m
      - repoagent.agents.adk.server
      - --agent
      - planner
      - --host
      - "0.0.0.0"
      - --port
      - "8001"
      - --workspace
      - /workspace/demo_repo
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - REPOAGENT_PROVIDER=${REPOAGENT_PROVIDER:-groq}
      - REPOAGENT_MODEL=${REPOAGENT_MODEL:-openai/gpt-oss-20b}
      - REPOAGENT_FALLBACK_MODEL=${REPOAGENT_FALLBACK_MODEL:-qwen/qwen3.8-27b}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      - REPOAGENT_WORKSPACE=/workspace/demo_repo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./demo_repo:/workspace/demo_repo:ro
      - ./src/repoagent:/app/src/repoagent:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  code-reviewer:
    build:
      context: .
      dockerfile: Dockerfile.agents
    image: repoagent-reviewer:latest
    container_name: repoagent-reviewer
    command:
      - python
      - -m
      - repoagent.agents.adk.server
      - --agent
      - reviewer
      - --host
      - "0.0.0.0"
      - --port
      - "8002"
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      - REPOAGENT_PROVIDER=${REPOAGENT_PROVIDER:-groq}
      - REPOAGENT_MODEL=${REPOAGENT_MODEL:-openai/gpt-oss-20b}
      - REPOAGENT_FALLBACK_MODEL=${REPOAGENT_FALLBACK_MODEL:-qwen/qwen3.8-27b}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src/repoagent:/app/src/repoagent:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  repoagent-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: repoagent-api:latest
    container_name: repoagent-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REPOAGENT_PROVIDER=${REPOAGENT_PROVIDER:-groq}
      - REPOAGENT_MODEL=${REPOAGENT_MODEL:-openai/gpt-oss-20b}
      - REPOAGENT_FALLBACK_MODEL=${REPOAGENT_FALLBACK_MODEL:-qwen/qwen3.8-27b}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      - REPOAGENT_PLANNER_URL=http://repo-planner:8001/
      - REPOAGENT_REVIEWER_URL=http://code-reviewer:8002/
      - REPOAGENT_RUNS_DIR=/app/runs
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_OWNER=${GITHUB_OWNER:-}
      - GITHUB_REPO=${GITHUB_REPO:-}
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-true}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./runs:/app/runs:rw
      - ./demo_repo:/workspace/demo_repo:ro
      - ./src/repoagent:/app/src/repoagent:rw
    depends_on:
      repo-planner:
        condition: service_healthy
      code-reviewer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  repoagent-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: repoagent-dashboard:latest
    container_name: repoagent-dashboard
    ports:
      - "8501:8501"
    environment:
      - REPOAGENT_API_URL=http://repoagent-api:8000
    volumes:
      - ./src/repoagent:/app/src/repoagent:rw
    depends_on:
      repoagent-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
