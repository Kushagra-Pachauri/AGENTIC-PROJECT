  - task_id: "TASK-11"
    name: "Implement Note archiving and restoration workflow"
    difficulty: "hard"
    category: "Adding a small feature"
    requirement: "Add is_archived: bool = False and archived_at: datetime | None = None to the Note model in src/notes_app/models.py. In src/notes_app/notes.py, add archive_note(note_id: str) -> Note and restore_note(note_id: str) -> Note (both raising KeyError if note not found). Update list_notes(user_id: str, include_archived: bool = False) to exclude archived notes by default. Update NotesApp to expose archive_user_note and list_user_notes with archive support."
    acceptance_criteria:
      - "Note model includes is_archived and archived_at fields."
      - "archive_note sets is_archived=True and archived_at to current UTC datetime."
      - "restore_note sets is_archived=False and archived_at=None."
      - "list_notes filters out archived notes unless include_archived=True."
      - "KeyError raised if note_id does not exist."
    expected_outcome: "Archiving lifecycle methods on NotesService and NotesApp."
    acceptance_test: |
      import pytest
      from notes_app.notes import NotesService

      def test_archive_workflow():
          svc = NotesService()
          n1 = svc.create_note("u1", "Active Note", "Content 1")
          n2 = svc.create_note("u1", "To Archive", "Content 2")

          assert len(svc.list_notes("u1")) == 2

          archived = svc.archive_note(n2.id)
          assert archived.is_archived is True
          assert archived.archived_at is not None

          # Excluded by default
          active = svc.list_notes("u1")
          assert len(active) == 1
          assert active[0].id == n1.id

          # Included when requested
          all_notes = svc.list_notes("u1", include_archived=True)
          assert len(all_notes) == 2

          # Restore
          restored = svc.restore_note(n2.id)
          assert restored.is_archived is False
          assert restored.archived_at is None
          assert len(svc.list_notes("u1")) == 2

          with pytest.raises(KeyError):
              svc.archive_note("nonexistent")

  - task_id: "TASK-12"
    name: "Password strength policy and salt-based hashing"
    difficulty: "hard"
    category: "Refactoring a small component"
    requirement: "Harden authentication in src/notes_app/auth.py: 1. Add validate_password_strength(password: str) -> bool that requires at least 8 characters, at least one uppercase letter, one lowercase letter, and one digit, raising ValueError('Password does not meet complexity requirements') if not met. 2. Enforce this check in register and change_password. 3. Upgrade _hash_password to use a salt prefix (e.g. 'salt:' + sha256) while maintaining verification support."
    acceptance_criteria:
      - "Passwords shorter than 8 chars or missing upper/lower/digit raise ValueError('Password does not meet complexity requirements')."
      - "Valid strong passwords like 'SecureP@ss1' are accepted."
      - "Registration and login succeed with strong passwords."
    expected_outcome: "AuthService with password complexity policy and secure hashing."
    acceptance_test: |
      import pytest
      from notes_app.auth import AuthService

      def test_password_policy():
          auth = AuthService()
          weak_passwords = ["short1A", "nouppercase1", "NOLOWERCASE1", "NoDigitsHere"]
          for wp in weak_passwords:
              with pytest.raises(ValueError, match="Password does not meet complexity requirements"):
                  auth.register(f"u_{wp[:4]}", "u@example.com", wp)

          user = auth.register("stronguser", "strong@example.com", "Str0ngP@ssword")
          assert auth.login("stronguser", "Str0ngP@ssword").id == user.id

  - task_id: "TASK-13"
    name: "Collaborative note sharing with permission control"
    difficulty: "hard"
    category: "Adding a small feature"
    requirement: "Add shared_with: list[str] = Field(default_factory=list) to Note in src/notes_app/models.py (storing user IDs). In src/notes_app/app.py, implement share_note(owner_username: str, note_id: str, target_username: str) -> Note. In NotesApp.list_user_notes(username: str, include_shared: bool = False), include notes where user.id is in note.shared_with if include_shared is True. Ensure delete_note still allows deletion ONLY by the owner."
    acceptance_criteria:
      - "Owner can share note with target registered user."
      - "Non-owner cannot share a note (raises PermissionError)."
      - "Target user sees shared note when include_shared=True."
      - "Shared user cannot delete the note (raises PermissionError)."
    expected_outcome: "Note sharing mechanism with ownership vs collaborator permissions."
    acceptance_test: |
      import pytest
      from notes_app.app import NotesApp

      def test_note_sharing():
          app = NotesApp()
          alice = app.register_user("alice", "alice@example.com", "pw1")
          bob = app.register_user("bob", "bob@example.com", "pw2")

          note = app.create_note("alice", "Shared Project", "Project details")
          app.share_note("alice", note.id, "bob")

          # Bob cannot delete
          with pytest.raises(PermissionError):
              app.delete_note("bob", note.id)

          # Bob can view when include_shared=True
          bob_notes = app.list_user_notes("bob", include_shared=True)
          assert len(bob_notes) == 1
          assert bob_notes[0].id == note.id

          # Bob does not see without include_shared
          assert len(app.list_user_notes("bob", include_shared=False)) == 0

  - task_id: "TASK-14"
    name: "JSON export and import service for user notes"
    difficulty: "hard"
    category: "Modifying an API endpoint"
    requirement: "Create src/notes_app/export.py with two functions: 1. export_user_notes_to_json(app: NotesApp, username: str) -> str returning a JSON string containing the user's notes with schema {'username': str, 'exported_at': str, 'notes': list[dict]}. 2. import_user_notes_from_json(app: NotesApp, username: str, json_str: str) -> int that parses JSON, validates schema, creates notes for the user, and returns the count of notes imported. If JSON is invalid or missing required keys, raise ValueError('Invalid export data format')."
    acceptance_criteria:
      - "export_user_notes_to_json produces valid JSON matching required structure."
      - "import_user_notes_from_json parses exported JSON and recreates notes, returning count."
      - "Invalid JSON raises ValueError('Invalid export data format')."
    expected_outcome: "src/notes_app/export.py implementing export and import functions."
    acceptance_test: |
      import json
      import pytest
      from notes_app.app import NotesApp
      from notes_app.export import export_user_notes_to_json, import_user_notes_from_json

      def test_export_import_roundtrip():
          app = NotesApp()
          app.register_user("alice", "alice@example.com", "pass1")
          app.register_user("bob", "bob@example.com", "pass2")

          app.create_note("alice", "N1", "C1")
          app.create_note("alice", "N2", "C2")

          exported = export_user_notes_to_json(app, "alice")
          data = json.loads(exported)
          assert data["username"] == "alice"
          assert len(data["notes"]) == 2

          count = import_user_notes_from_json(app, "bob", exported)
          assert count == 2
          assert len(app.list_user_notes("bob")) == 2

      def test_import_invalid_json():
          app = NotesApp()
          app.register_user("alice", "alice@example.com", "pass1")
          with pytest.raises(ValueError, match="Invalid export data format"):
              import_user_notes_from_json(app, "alice", "{bad json")
          with pytest.raises(ValueError, match="Invalid export data format"):
              import_user_notes_from_json(app, "alice", json.dumps({"invalid": "schema"}))

  - task_id: "TASK-15"
    name: "In-memory event dispatcher and activity hooks"
    difficulty: "hard"
    category: "Refactoring a small component"
    requirement: "Create src/notes_app/events.py defining an EventBus with subscribe(event_type: str, callback) and emit(event_type: str, payload: dict). Integrate this EventBus into NotesApp in src/notes_app/app.py as app.events. When register_user is called, emit 'user_registered' with {'username': username}. When create_note is called, emit 'note_created' with {'username': username, 'note_id': note.id}. When delete_note is called, emit 'note_deleted' with {'username': username, 'note_id': note_id}."
    acceptance_criteria:
      - "EventBus allows subscribing callbacks to event types."
      - "NotesApp.register_user emits 'user_registered'."
      - "NotesApp.create_note emits 'note_created'."
      - "NotesApp.delete_note emits 'note_deleted'."
      - "Existing tests in demo_repo continue to pass without error."
    expected_outcome: "src/notes_app/events.py and event dispatch integration in NotesApp."
    acceptance_test: |
      from notes_app.app import NotesApp
      from notes_app.events import EventBus

      def test_event_bus():
          events_log = []
          app = NotesApp()
          app.events.subscribe("user_registered", lambda p: events_log.append(("reg", p)))
          app.events.subscribe("note_created", lambda p: events_log.append(("create", p)))
          app.events.subscribe("note_deleted", lambda p: events_log.append(("delete", p)))

          app.register_user("charlie", "c@example.com", "p1")
          assert len(events_log) == 1
          assert events_log[0][0] == "reg"
          assert events_log[0][1]["username"] == "charlie"

          note = app.create_note("charlie", "Title", "Content")
          assert len(events_log) == 2
          assert events_log[1][0] == "create"
          assert events_log[1][1]["note_id"] == note.id

          app.delete_note("charlie", note.id)
          assert len(events_log) == 3
          assert events_log[2][0] == "delete"
