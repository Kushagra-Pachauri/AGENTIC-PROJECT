    difficulty: "easy"
    category: "Validation logic"
    requirement: "Update register method in src/notes_app/auth.py to validate that email contains an '@' symbol with at least one character before and after '@', and at least one '.' in the domain part. Raise ValueError('Invalid email format') if the email is invalid."
    acceptance_criteria:
      - "Valid emails like 'user@example.com' or 'a.b@domain.org' are accepted."
      - "Emails missing '@', empty user part ('@domain.com'), empty domain ('user@'), or missing '.' in domain ('user@domain') raise ValueError('Invalid email format')."
      - "Existing user registration functionality remains intact for valid emails."
    expected_outcome: "Strict email validation in AuthService.register raising ValueError with message 'Invalid email format'."
    acceptance_test: |
      import pytest
      from notes_app.auth import AuthService

      def test_email_validation_valid():
          auth = AuthService()
          user = auth.register("alice", "alice@example.com", "pw123")
          assert user.email == "alice@example.com"

      def test_email_validation_invalid():
