# RepoAgent Evaluation Dataset: 15 Diverse Coding Tasks
# Across 3 Difficulty Tiers (5 Easy, 5 Medium, 5 Hard)
# Operating on isolated instances of the notes_app repository

version: "1.0"
repository: "notes_app"
total_tasks: 15

tasks:
  # =========================================================================
  # EASY TIER (5 Tasks)
  # =========================================================================

  - task_id: "TASK-01"
    name: "Add count_notes utility method"
    difficulty: "easy"
    category: "Utility function"
    requirement: "Add a count_notes(user_id: str) -> int method to NotesService in src/notes_app/notes.py that returns the total count of notes owned by the specified user_id, and expose it on NotesApp in src/notes_app/app.py as count_user_notes(username: str) -> int."
    acceptance_criteria:
      - "NotesService.count_notes(user_id) returns integer count of notes for that user."
      - "Returns 0 if the user has no notes."
      - "NotesApp.count_user_notes(username) returns integer count of notes for that registered user."
      - "NotesApp.count_user_notes raises ValueError if the user does not exist."
    expected_outcome: "count_notes implemented on NotesService and count_user_notes on NotesApp."
    acceptance_test: |
      import pytest
      from notes_app.app import NotesApp
      from notes_app.notes import NotesService

      def test_count_notes_service():
          service = NotesService()
          assert service.count_notes("u1") == 0
          service.create_note("u1", "T1", "C1")
          service.create_note("u1", "T2", "C2")
          service.create_note("u2", "T3", "C3")
          assert service.count_notes("u1") == 2
          assert service.count_notes("u2") == 1
          assert service.count_notes("u3") == 0

      def test_count_notes_app():
          app = NotesApp()
          app.register_user("alice", "alice@example.com", "pass123")
          assert app.count_user_notes("alice") == 0
          app.create_note("alice", "Note 1", "Content 1")
          assert app.count_user_notes("alice") == 1
          with pytest.raises(ValueError, match="not found"):
              app.count_user_notes("nonexistent")

  - task_id: "TASK-02"
