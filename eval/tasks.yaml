  - task_id: "TASK-06"
    name: "Case-insensitive note search by title or content"
    difficulty: "medium"
    category: "Adding a small feature"
    requirement: "Add a search_notes(user_id: str, query: str) -> list[Note] method to NotesService in src/notes_app/notes.py. It should perform a case-insensitive substring search matching against either title or content for all notes belonging to the specified user_id. Also expose search_user_notes(username: str, query: str) -> list[Note] on NotesApp in src/notes_app/app.py."
    acceptance_criteria:
      - "NotesService.search_notes returns all notes where query appears in title or content (case-insensitive)."
      - "Does not return notes owned by other users."
      - "Empty query matches all notes owned by that user."
      - "NotesApp.search_user_notes works with username lookup."
    expected_outcome: "search_notes method on NotesService and search_user_notes on NotesApp."
    acceptance_test: |
      from notes_app.app import NotesApp
      from notes_app.notes import NotesService

      def test_search_notes():
          svc = NotesService()
          svc.create_note("u1", "Meeting Notes", "Discuss project roadmap")
          svc.create_note("u1", "Shopping List", "Buy milk and apples")
          svc.create_note("u2", "Meeting Agenda", "Roadmap discussion")

          results = svc.search_notes("u1", "roadmap")
          assert len(results) == 1
          assert results[0].title == "Meeting Notes"

          results_upper = svc.search_notes("u1", "MEETING")
          assert len(results_upper) == 1

          results_empty = svc.search_notes("u1", "")
          assert len(results_empty) == 2

      def test_search_notes_app():
          app = NotesApp()
          app.register_user("bob", "bob@example.com", "secret")
          app.create_note("bob", "Doc 1", "Alpha Beta")
          app.create_note("bob", "Doc 2", "Gamma Delta")
          found = app.search_user_notes("bob", "alpha")
          assert len(found) == 1
          assert found[0].title == "Doc 1"

  - task_id: "TASK-07"
    name: "Fix inconsistent note deletion error handling"
    difficulty: "medium"
    category: "Fixing a reproducible bug"
    requirement: "In src/notes_app/app.py, delete_note currently returns False when the note does not exist. Modify delete_note in NotesApp to raise KeyError(f'Note {note_id} not found') when note_id does not exist, while continuing to raise PermissionError when the note belongs to another user."
    acceptance_criteria:
      - "Deleting a non-existent note raises KeyError."
      - "Deleting a note owned by another user still raises PermissionError."
      - "Deleting own note returns True."
    expected_outcome: "delete_note in NotesApp raises KeyError when note_id is not in notes service."
    acceptance_test: |
      import pytest
      from notes_app.app import NotesApp

      def test_delete_note_error_handling():
          app = NotesApp()
          app.register_user("alice", "alice@example.com", "pw1")
          app.register_user("bob", "bob@example.com", "pw2")

          note = app.create_note("alice", "Alice Note", "Body")

          # 1. Non-existent note raises KeyError
          with pytest.raises(KeyError, match="not found"):
              app.delete_note("alice", "nonexistent-uuid")

          # 2. Other user deleting note raises PermissionError
          with pytest.raises(PermissionError):
              app.delete_note("bob", note.id)

          # 3. Owner deleting note succeeds
          assert app.delete_note("alice", note.id) is True

  - task_id: "TASK-08"
    name: "Add pagination support to list_notes"
    difficulty: "medium"
    category: "Modifying an API endpoint"
    requirement: "Add a list_notes_paginated(user_id: str, offset: int = 0, limit: int = 10) -> list[Note] method to NotesService in src/notes_app/notes.py. It should return notes owned by user_id, sorted by created_at descending (newest first), sliced by [offset:offset+limit]. Also validate that offset >= 0 and limit >= 1, raising ValueError if invalid."
    acceptance_criteria:
      - "Returns notes sorted newest first (created_at desc)."
      - "Respects offset and limit parameters."
      - "Raises ValueError for offset < 0 or limit < 1."
    expected_outcome: "list_notes_paginated method on NotesService with validation and sorting."
    acceptance_test: |
      import time
      import pytest
      from notes_app.notes import NotesService

      def test_pagination():
          svc = NotesService()
          for i in range(5):
              svc.create_note("u1", f"Note {i}", f"Content {i}")
              time.sleep(0.01)

          page1 = svc.list_notes_paginated("u1", offset=0, limit=2)
          assert len(page1) == 2
          assert page1[0].title == "Note 4"
          assert page1[1].title == "Note 3"

          page2 = svc.list_notes_paginated("u1", offset=2, limit=2)
          assert len(page2) == 2
          assert page2[0].title == "Note 2"

          with pytest.raises(ValueError):
              svc.list_notes_paginated("u1", offset=-1, limit=5)
          with pytest.raises(ValueError):
              svc.list_notes_paginated("u1", offset=0, limit=0)

